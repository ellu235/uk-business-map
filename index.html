<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英国企业参访地图（含住宿点）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    #map { height: 90vh; width: 100%; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .custom-marker-dot { width:16px;height:16px;border-radius:50%;border:3px solid #fff;cursor:pointer;transition:transform 0.1s ease-out;}
    .custom-marker-dot:hover{transform:scale(1.3);}
    .marker-p1{background-color:#ef4444;}
    .marker-p2{background-color:#3b82f6;}
    .marker-p3{background-color:#10b981;}
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-indigo-500 pb-2">
      英国企业参访地图（含住宿点）
    </h1>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let mapInstance;

    const GEOCODE_LOOKUP = {
      "LONDON": [51.5072, -0.1276],
      "BIRMINGHAM": [52.4862, -1.8904],
      "MANCHESTER": [53.4808, -2.2426],
      "LEEDS": [53.8008, -1.5491],
      "LUTON": [51.8789, -0.4172],
      "LEICESTER": [52.6369, -1.1398],
      "LIVERPOOL": [53.4084, -2.9916],
      "BRISTOL": [51.4545, -2.5879],
      "WARRINGTON": [53.3888, -2.5802]
    };

    const COMPANIES = [
      { name: "Amcor Packaging UK Ltd.", city: "Bristol", address: "83 Tower Road North, BS30 8XP", priority: 2 },
      { name: "Clifton Packaging Group Ltd.", city: "Leicester", address: "Meridian Business Park, Leicester", priority: 2 },
      { name: "Esterform Packaging", city: "Leeds", address: "Royds Farm Rd, Leeds", priority: 1 },
      { name: "Alpla UK", city: "Warrington", address: "Stonecross Business Park, Warrington", priority: 2 },
      { name: "Logoplaste UK", city: "London", address: "Hedley Ave, Grays RM20 4AL", priority: 3 },
      { name: "Centriforce Ltd", city: "Liverpool", address: "14-16 Derby Road, Bootle, Liverpool", priority: 2 },
      { name: "Bell Packaging Ltd.", city: "Luton", address: "Airport Way, Luton", priority: 2 },
      { name: "Parkside Flex", city: "Leeds", address: "Tyler Close, Normanton", priority: 2 },
      { name: "Coral Products", city: "Manchester", address: "Haydock Industrial Estate, WA11 9TP", priority: 2 }
    ];

    const P1 = "#ef4444";
    const P2 = "#3b82f6";
    const P3 = "#10b981";

    const initializeMap = () => {
      mapInstance = L.map('map').setView([54.0, -2.0], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
      }).addTo(mapInstance);

      // 添加公司标记
      COMPANIES.forEach(c => {
        const coords = GEOCODE_LOOKUP[c.city.toUpperCase()];
        if (!coords) return;
        const color = c.priority === 1 ? P1 : c.priority === 2 ? P2 : P3;
        const icon = L.divIcon({
          html: `<div class="custom-marker-dot" style="background-color:${color};"></div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11],
        });
        L.marker(coords, { icon }).bindPopup(`<b>${c.name}</b><br>${c.address}`).addTo(mapInstance);
      });

      // 添加住宿点
      addAccommodations();
    };

    const addAccommodations = () => {
      const accommodations = [
        {
          name: "Premier Inn London City (Aldgate)",
          address: "66 Alie St, London E1 8PX, UK",
          link: "https://www.premierinn.com/gb/en/hotels/england/greater-london/london/london-city-aldgate.html",
          coords: [51.5136, -0.0725]
        },
        {
          name: "Travelodge Birmingham Central",
          address: "230 Broad St, Birmingham B15 1AY, UK",
          link: "https://www.travelodge.co.uk/hotels/12/Birmingham-Central-hotel",
          coords: [52.4763, -1.9115]
        },
        {
          name: "Holiday Inn Express Manchester City Centre",
          address: "Oxford Rd, Manchester M1 5QA, UK",
          link: "https://www.ihg.com/holidayinnexpress/hotels/gb/en/manchester/mancc/hoteldetail",
          coords: [53.4741, -2.2382]
        }
      ];

      const hotelIcon = L.icon({
        iconUrl: "./59eafc9f-fc25-463f-9ec8-c8040d679b42.png",
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -28]
      });

      accommodations.forEach(hotel => {
        const popupContent = `
          <div class="p-3 text-sm">
            <h3 class="text-lg font-bold text-orange-600 mb-2">${hotel.name}</h3>
            <p><strong>地址:</strong> ${hotel.address}</p>
            <p><a href="${hotel.link}" target="_blank" class="text-blue-500 hover:underline">查看详情</a></p>
          </div>`;
        L.marker(hotel.coords, { icon: hotelIcon })
          .bindPopup(popupContent)
          .addTo(mapInstance);
      });
    };

    document.addEventListener('DOMContentLoaded', initializeMap);
  </script>
</body>
</html>
